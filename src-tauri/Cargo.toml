[package]
name = "teglato"
version = "0.3.1"
description = "Gatinho reativo de área de trabalho com overlay transparente always-on-top e suporte nativo a OBS Studio"
authors = ["Teglato Contributors"]
edition = "2021"

[lib]
name = "teglato_lib"
crate-type = ["rlib"]

[features]
# Habilitado em builds de produção para embutir `../dist` no executável (sem precisar de dev server).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { version = "0.7", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
