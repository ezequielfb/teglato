name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Test, typecheck and build frontend
        run: npm test && npm run typecheck && npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --features custom-protocol

      - name: Build standalone portable executable
        run: npm run build:portable

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item "src-tauri/target/release/teglato.exe" "release-artifacts/Teglato.exe"
          $exeHash = (Get-FileHash "release-artifacts/Teglato.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  Teglato.exe" | Set-Content -Encoding utf8 "release-artifacts/SHA256SUMS.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teglato-Windows-Portable
          path: release-artifacts/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: "Teglato ${{ github.ref_name }}"
          body: |
            ## Baixar e Rodar (Sem Instalação — Windows 10/11)

            1. Clique em **`Teglato.exe`** abaixo para baixar (ignore os links `Source code` no final, que são apenas para desenvolvedores).
            2. Dê duplo clique em **`Teglato.exe`** — o gatinho já abre no canto inferior direito da tela, sem precisar instalar nada!

            ### Dicas rápidas
            - **Configurações e 13 pelagens:** clique no ícone perto do relógio do Windows ou pressione `Ctrl + Shift + ,`
            - **Travar / destravar posição:** `Ctrl + Shift + L`
            - **OBS Studio (fundo transparente):** adicione uma *Fonte de Navegador* para `http://127.0.0.1:3777/?obs=1`
            - **Aviso do Windows SmartScreen?** Clique em **Mais informações** → **Executar assim mesmo**.
          files: |
            release-artifacts/Teglato.exe
            release-artifacts/SHA256SUMS.txt
